kind = "web"
previewPath = "/"
title = "SmartWOD Timer"
version = "1.0.0"
id = "artifacts/smartwod-timer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22961

[services.development]
run = "pnpm --filter @workspace/smartwod-timer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smartwod-timer", "run", "build" ]
publicDir = "artifacts/smartwod-timer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22961"
BASE_PATH = "/"
